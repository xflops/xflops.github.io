<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">TorchRL DQN with Flame Runner architecture</title>
  <desc id="desc">A local TorchRL learner publishes policy weights through Flame Runner, collector services gather transitions, replay-buffer shard services store TensorDict batches in Flame object storage, and sampled batches return to the learner for DQN optimization.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#047857"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b45309"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .learner { fill: #eff6ff; stroke: #3b82f6; }
      .runner { fill: #f8fafc; stroke: #64748b; }
      .collector { fill: #ecfdf5; stroke: #10b981; }
      .replay { fill: #fffbeb; stroke: #f59e0b; }
      .cache { fill: #fdf2f8; stroke: #db2777; }
      .title { font: 700 26px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 14px Arial, sans-serif; fill: #0f172a; }
      .small { font: 13px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .blue-line { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .green-line { stroke: #047857; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .amber-line { stroke: #b45309; stroke-width: 2.5; fill: none; marker-end: url(#arrow-amber); }
      .soft-line { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect class="bg" width="1180" height="720"/>
  <text class="title" x="40" y="46">TorchRL DQN with Flame Runner and Sharded Replay</text>
  <text class="small" x="40" y="72">The learner stays local; Flame distributes collection, replay storage, and sample requests.</text>

  <rect class="panel learner" x="44" y="118" width="250" height="230" rx="14"/>
  <text class="section" x="70" y="154">Local TorchRL Learner</text>
  <rect class="panel" x="70" y="176" width="198" height="44" rx="8"/>
  <text class="label" x="92" y="203">QValueActor policy</text>
  <rect class="panel" x="70" y="232" width="198" height="44" rx="8"/>
  <text class="label" x="104" y="259">DQNLoss</text>
  <rect class="panel" x="70" y="288" width="198" height="44" rx="8"/>
  <text class="label" x="93" y="315">Adam optimizer</text>

  <rect class="panel runner" x="382" y="128" width="214" height="150" rx="14"/>
  <text class="section" x="421" y="164">Flame Runner</text>
  <text class="small" x="414" y="194">put_object(policy)</text>
  <text class="small" x="414" y="218">service scheduling</text>
  <text class="small" x="414" y="242">rr.get(futures)</text>

  <rect class="panel collector" x="705" y="100" width="360" height="245" rx="14"/>
  <text class="section" x="733" y="136">Collector Services</text>
  <text class="small" x="733" y="160">Stateful Gymnasium workers on Flame executors</text>
  <rect class="panel" x="734" y="184" width="136" height="54" rx="8"/>
  <text class="label" x="760" y="207">Collector 0</text>
  <text class="tiny" x="755" y="226">env + policy</text>
  <rect class="panel" x="900" y="184" width="136" height="54" rx="8"/>
  <text class="label" x="926" y="207">Collector 1</text>
  <text class="tiny" x="921" y="226">env + policy</text>
  <rect class="panel" x="734" y="258" width="136" height="54" rx="8"/>
  <text class="label" x="760" y="281">Collector 2</text>
  <text class="tiny" x="755" y="300">env + policy</text>
  <rect class="panel" x="900" y="258" width="136" height="54" rx="8"/>
  <text class="label" x="926" y="281">Collector 3</text>
  <text class="tiny" x="921" y="300">env + policy</text>

  <rect class="panel replay" x="126" y="455" width="505" height="188" rx="14"/>
  <text class="section" x="156" y="492">ReplayBuffer Services</text>
  <text class="small" x="156" y="516">TorchRL ReplayBuffer backed by FlameObjectStorage</text>
  <rect class="panel" x="156" y="540" width="92" height="64" rx="8"/>
  <text class="label" x="174" y="565">Shard 0</text>
  <text class="tiny" x="176" y="586">sample()</text>
  <rect class="panel" x="270" y="540" width="92" height="64" rx="8"/>
  <text class="label" x="288" y="565">Shard 1</text>
  <text class="tiny" x="290" y="586">sample()</text>
  <rect class="panel" x="384" y="540" width="92" height="64" rx="8"/>
  <text class="label" x="402" y="565">Shard 2</text>
  <text class="tiny" x="404" y="586">sample()</text>
  <rect class="panel" x="498" y="540" width="92" height="64" rx="8"/>
  <text class="label" x="516" y="565">Shard 3</text>
  <text class="tiny" x="518" y="586">sample()</text>

  <rect class="panel cache" x="760" y="475" width="330" height="142" rx="14"/>
  <text class="section" x="800" y="512">Flame Object Cache</text>
  <text class="small" x="800" y="540">ObjectRef per replay shard</text>
  <text class="small" x="800" y="566">patch_object appends TensorDict batches</text>
  <text class="small" x="800" y="592">get_object materializes sampled state</text>

  <path class="blue-line" d="M294 197 C326 190, 346 181, 382 181"/>
  <text class="tiny" x="314" y="166">weights_ref</text>

  <path class="blue-line" d="M596 190 C632 166, 660 146, 705 146"/>
  <text class="tiny" x="619" y="136">collect()</text>

  <path class="green-line" d="M884 345 C857 393, 742 442, 632 510"/>
  <text class="tiny" x="738" y="410">extend(TensorDict)</text>

  <path class="amber-line" d="M631 560 C682 548, 715 543, 760 542"/>
  <text class="tiny" x="655" y="526">patch_object</text>

  <path class="amber-line" d="M760 586 C694 650, 268 680, 204 348"/>
  <text class="tiny" x="394" y="676">parallel sample batches</text>

  <path class="soft-line" d="M171 348 C214 396, 244 430, 292 455"/>
  <text class="tiny" x="117" y="393">optimize and repeat</text>

  <rect x="42" y="660" width="1096" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="tiny" x="58" y="682">Measured path: four collectors, four replay shards, synthetic sample work, and up to four concurrent sample requests per optimization step.</text>
</svg>
