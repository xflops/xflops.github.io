<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Build your own sandbox cloud with Flame</title>
  <desc id="desc">Hermes uses its standard terminal and file tools through hermes-flamepy and the Flame SDK. Flame schedules work across Linux workers with gVisor sandboxes. flame-cluster supplies the console, operator and flmlet worker enrollment. Solid arrows show execution; dashed arrows show management. Open sandboxes retain files between calls; suspend and resume starts a fresh filesystem.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#ea580c"/></marker>
    <marker id="manage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}
      .eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#c2410c}
      .title{font-size:34px;font-weight:750;letter-spacing:-.8px}
      .subtitle{font-size:17px;fill:#596579}
      .heading{font-size:21px;font-weight:700}
      .label{font-size:17px;font-weight:650}
      .detail{font-size:14px;fill:#596579}
      .small{font-size:13px;fill:#596579}
      .box{fill:#fff;stroke:#dce2eb;stroke-width:1.5}
      .exec{fill:none;stroke:#ea580c;stroke-width:2.5;marker-end:url(#arrow)}
      .management{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#manage)}
    </style>
  </defs>
  <rect width="1280" height="800" rx="24" fill="#faf8f5"/>
  <text x="48" y="48" class="eyebrow">FLAME · YOUR INFRASTRUCTURE</text>
  <text x="48" y="96" class="title">Your agents. Your workers. One sandbox cloud.</text>
  <text x="48" y="128" class="subtitle">Keep the agent interface familiar. Move execution into a shared Linux worker pool.</text>

  <rect x="48" y="172" width="294" height="455" rx="18" class="box"/>
  <text x="72" y="210" class="eyebrow">CLIENT MACHINE</text>
  <text x="72" y="247" class="heading">Hermes Agent</text>
  <text x="72" y="274" class="detail">Your model and orchestration</text>
  <rect x="72" y="303" width="246" height="80" rx="12" fill="#f1f5f9"/>
  <text x="92" y="334" class="label">Standard Hermes tools</text>
  <text x="92" y="359" class="detail">Terminal · read · write · patch</text>
  <path d="M195 386V416" class="exec"/>
  <rect x="72" y="425" width="246" height="85" rx="12" fill="#fff3e8" stroke="#fed7aa"/>
  <text x="92" y="457" class="label">hermes-flamepy 0.3.2</text>
  <text x="92" y="484" class="detail">terminal.backend: flamepy</text>
  <text x="72" y="551" class="label">flamepy.agent.Sandbox</text>
  <text x="72" y="578" class="detail">Submit commands, receive results</text>
  <text x="72" y="604" class="small">Connect with your Flame client bundle</text>

  <rect x="400" y="172" width="374" height="455" rx="18" class="box"/>
  <text x="424" y="210" class="eyebrow">KUBERNETES CONTROL PLANE</text>
  <text x="424" y="247" class="heading">Flame + flame-cluster</text>
  <rect x="424" y="281" width="326" height="91" rx="12" fill="#f1f5f9"/>
  <text x="444" y="313" class="label">Console + operator</text>
  <text x="444" y="339" class="detail">Enroll workers · inspect sessions</text>
  <text x="444" y="359" class="small">Reconcile services and configuration</text>
  <rect x="424" y="418" width="326" height="88" rx="12" fill="#fff3e8" stroke="#fed7aa"/>
  <text x="444" y="450" class="label">Flame gateway + sessions</text>
  <text x="444" y="478" class="detail">Schedule work onto available executors</text>
  <text x="424" y="551" class="label">Shared execution capacity</text>
  <text x="424" y="578" class="detail">One endpoint for the agent client</text>
  <text x="424" y="604" class="small">Allocation follows cluster policy and capacity</text>
  <path d="M342 462H414" class="exec"/>

  <rect x="832" y="172" width="400" height="455" rx="18" class="box"/>
  <text x="856" y="210" class="eyebrow">LINUX WORKER POOL</text>
  <text x="856" y="247" class="heading">Machines you operate</text>
  <rect x="856" y="281" width="352" height="129" rx="12" fill="#f1f5f9"/>
  <text x="876" y="311" class="label">Worker A · flmlet + FEM</text>
  <rect x="876" y="328" width="312" height="62" rx="9" fill="#fff" stroke="#dce2eb"/>
  <text x="892" y="353" class="label">Sandbox A · flmbox / gVisor</text>
  <text x="892" y="376" class="small">Project files · packages · shell commands</text>
  <rect x="856" y="432" width="352" height="129" rx="12" fill="#f1f5f9"/>
  <text x="876" y="462" class="label">Worker B · flmlet + FEM</text>
  <rect x="876" y="479" width="312" height="62" rx="9" fill="#fff" stroke="#dce2eb"/>
  <text x="892" y="504" class="label">Sandbox B · flmbox / gVisor</text>
  <text x="892" y="527" class="small">A separate session and working filesystem</text>
  <text x="856" y="604" class="detail">Add prepared hosts through the join command</text>
  <path d="M774 462H804V359H866" class="exec"/>
  <path d="M804 462V510H866" class="exec"/>
  <path d="M750 305H846" class="management"/>

  <rect x="48" y="655" width="1184" height="101" rx="16" fill="#fff" stroke="#e6dfd5"/>
  <text x="72" y="687" class="label">Reuse a workspace while its sandbox stays open.</text>
  <text x="72" y="713" class="detail">Suspend / resume retains the session ID; the current runtime starts with fresh files and shell state.</text>
  <path d="M72 737H112" class="exec"/><text x="126" y="742" class="small">Command execution</text>
  <path d="M310 737H350" class="management"/><text x="364" y="742" class="small">Enrollment and management</text>
</svg>
