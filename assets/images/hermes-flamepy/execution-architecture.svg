<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title description">
  <title id="title">Hermes code execution through Flame</title>
  <desc id="description">Hermes and its flamepy plugin run on the Mac. The plugin connects directly to the Flame API. The scheduler assigns work to Linux executors running flmbox and gVisor. The sandbox tool retains a filesystem across calls; the session tool submits independent snippets to available executors.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be5932"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #243442; }
      .label { font-size: 18px; font-weight: 600; }
      .body { font-size: 16px; }
      .small { font-size: 14px; fill: #526370; }
      .arrow { fill: none; stroke: #be5932; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1080" height="470" fill="#fff"/>
  <rect x="20" y="20" width="470" height="145" rx="12" fill="#f4f6f8" stroke="#c9d2d9"/>
  <text x="42" y="50" class="label">Mac / Hermes runtime</text>
  <rect x="42" y="72" width="155" height="67" rx="8" fill="#fff" stroke="#aab9c3"/>
  <text x="119" y="101" text-anchor="middle" class="label">Hermes agent</text>
  <text x="119" y="123" text-anchor="middle" class="small">Tool orchestration</text>
  <path d="M 201 105 H 235" class="arrow"/>
  <rect x="246" y="72" width="220" height="67" rx="8" fill="#fff4ed" stroke="#db7547"/>
  <text x="356" y="99" text-anchor="middle" class="label">hermes-flamepy</text>
  <text x="356" y="123" text-anchor="middle" class="small">sandbox · session · SDK</text>
  <path d="M 490 105 H 596" class="arrow"/>
  <text x="544" y="78" text-anchor="middle" class="small">Direct API</text>
  <rect x="610" y="20" width="450" height="145" rx="12" fill="#f4f6f8" stroke="#c9d2d9"/>
  <text x="633" y="50" class="label">Flame cluster</text>
  <rect x="645" y="72" width="380" height="67" rx="8" fill="#fff" stroke="#aab9c3"/>
  <text x="835" y="101" text-anchor="middle" class="label">Session manager and scheduler</text>
  <text x="835" y="123" text-anchor="middle" class="small">Assign tasks to available executors</text>
  <rect x="20" y="210" width="1040" height="240" rx="12" fill="#f9fafb" stroke="#c9d2d9"/>
  <text x="42" y="242" class="label">Linux workers · flmbox · gVisor / runsc</text>
  <path d="M 835 165 V 188 H 500 V 260 H 260 V 267" class="arrow"/>
  <path d="M 835 188 H 800 V 267" class="arrow"/>
  <rect x="55" y="278" width="410" height="103" rx="9" fill="#fff4ed" stroke="#db7547"/>
  <text x="260" y="308" text-anchor="middle" class="label">sandbox: dependent steps</text>
  <text x="260" y="337" text-anchor="middle" class="body">Create CSV → Analyze → Read report</text>
  <text x="260" y="363" text-anchor="middle" class="small">One retained working filesystem</text>
  <rect x="610" y="278" width="410" height="103" rx="9" fill="#fff" stroke="#aab9c3"/>
  <text x="815" y="308" text-anchor="middle" class="label">session: independent tasks</text>
  <text x="815" y="337" text-anchor="middle" class="body">Scenario 1 · Scenario 2 · Scenario 3</text>
  <text x="815" y="363" text-anchor="middle" class="small">Submitted together; no shared-files assumption</text>
  <text x="260" y="414" text-anchor="middle" class="small">Files persist while the sandbox remains available</text>
  <text x="815" y="414" text-anchor="middle" class="small">Concurrency depends on cluster capacity</text>
</svg>
